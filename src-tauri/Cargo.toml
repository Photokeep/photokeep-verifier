[package]
name = "photokeep-verifier"
version = "0.1.0"
description = "Photokeep offline encrypted file verifier"
authors = ["Photokeep"]
edition = "2021"

[lib]
name = "photokeep_verifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
thiserror = "2"
urlencoding = "2"
walkdir = "2"
zip = "2"
open = "5"
